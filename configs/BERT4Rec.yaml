# ==============================================================================
# BERT4Rec — Bidirectional Encoder Representations for Sequential Recommendation
#
# Reference: Sun et al. (2019) "BERT4Rec: Sequential Recommendation with
# Bidirectional Encoder Representations from Transformers." CIKM 2019.
#
# Role in study: Bidirectional counterpart to SASRec. Uses masked item
# prediction (like BERT's MLM) instead of next-item prediction.
# Included to evaluate unidirectional vs bidirectional attention in RecSys.
# ==============================================================================

model: BERT4Rec

# Architecture
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: 'gelu'
layer_norm_eps: 1e-12

# Masking
mask_ratio: 0.2                 # Fraction of items masked during training

# Sequence
MAX_ITEM_LIST_LENGTH: 50
loss_type: 'CE'

# Evaluation Override
eval_args:
    split: {'LS': 'valid_and_test'}
    group_by: user
    order: TO
    mode: full

# Training
learning_rate: 0.001
train_batch_size: 256
train_neg_sample_args: null
